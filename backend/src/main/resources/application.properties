# Server
server.port=8080

# Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sport_platform
spring.datasource.username=sport_user
spring.datasource.password=sport_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=AfricaSportPlatformSecretKey2026PanAfricaBase64EncodedSecretKeyForJWT
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173

# WebSocket
spring.websocket.message-broker.relay-host=localhost
spring.websocket.message-broker.relay-port=61613

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.africa.sport=INFO
logging.level.org.springframework.security=WARN
